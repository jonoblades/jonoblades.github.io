title: Jonathan Blades
description: Software developer, writer and maker based near Glasgow, Scotland.

url: "https://jonoblades.github.io"
baseurl: ""

defaults:
  - scope:
      path: ""
    values:
      layout: page
      showReadTime: true
      image:
        path: /assets/images/og-image.png
        width: 1200
        height: 630
  - scope:
      path: ""
      type: fifty-words
    values:
      layout: post
  - scope:
      path: ""
      type: writing
    values:
      layout: post
  - scope:
      path: "games"
    values:
      layout: game
      showReadTime: false
      showSettings: true

author:
  name: Jonathan Blades
  url: https://jonoblades.github.io
locale: en_GB

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-paginate-v2
  - jekyll-reading-time
  - jekyll-last-modified-at

collections:
  writing:
    title: "Writing"
    output: true
    permalink: /writing/:name/
  fifty-words:
    title: "Fifty Words"
    output: true
    permalink: /fifty-words/:name/

feed:
  icon: "/assets/favicon-512x512.png"
  logo: "/assets/favicon-512x512.png"
  collections:
    writing:
      path: "/writing/feed.xml"
    fifty-words:
      path: "/fifty-words/feed.xml"

jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: archive
  permalinks:
    tag: /tags/:name/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .jekyll-metadata
  - node_modules
