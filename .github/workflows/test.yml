name: Test

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable Corepack
        run: |
          corepack enable
          yarn --version

      - name: Restore Yarn cache
        uses: actions/setup-node@v4
        with:
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Run tests
        run: yarn test:run

      - name: Validate Worker bundle
        run: yarn check:site-visits